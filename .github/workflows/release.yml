name: release

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:
  verify:
    name: Verify release invariants
    if: >-
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'releases/v')
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release branch matches package.json and the CHANGELOG
        run: |
          VERSION="${HEAD_REF#releases/v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Branch version $VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          grep -Fxq "## v$VERSION" CHANGELOG.md
      - name: Check the pinned JETLS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${HEAD_REF#releases/v}"
          REVISION=$(node -p "require('./JETLS_VERSION.json').revision")
          gh api "repos/aviatesk/JETLS.jl/git/ref/tags/$REVISION" --jq .ref
          awk -v ver="## v$VERSION" '
            /^## / { if (found) exit; if ($0 == ver) { found = 1; next } }
            found' CHANGELOG.md |
            grep -Fq -- "- Pinned JETLS: [\`$REVISION\`]"
      - name: Check the release tag does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${HEAD_REF#releases/v}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

  publish:
    name: Package and publish
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'releases/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci
      # `vsce package` runs the `vscode:prepublish` script, which re-runs the
      # checks, the tests, and the production build against the packaged state.
      - name: Package the extension
        run: npx vsce package
      # The steps below are idempotent so a failed run can be re-run from
      # any point: the publishes skip an already-published version, the
      # tag push skips an existing tag, and the release creation skips an
      # existing release. Open VSX comes last so its availability cannot
      # block the tag or the GitHub release.
      - name: Publish to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION="${HEAD_REF#releases/v}"
          npx vsce publish --skip-duplicate --packagePath "jetls-client-$VERSION.vsix"
      - name: Push the release tag
        run: |
          VERSION="${HEAD_REF#releases/v}"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" "$MERGE_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${HEAD_REF#releases/v}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          NOTES=$(awk -v ver="## v$VERSION" '
            /^## / { if (found) exit; if ($0 == ver) { found = 1; next } }
            found' CHANGELOG.md)
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            "jetls-client-$VERSION.vsix"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VERSION="${HEAD_REF#releases/v}"
          npx ovsx publish --skip-duplicate --packagePath "jetls-client-$VERSION.vsix" -p "$OVSX_PAT"
