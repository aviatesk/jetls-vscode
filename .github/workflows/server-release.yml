name: server release

on:
  repository_dispatch:
    types:
      - server-release
  workflow_dispatch:
    inputs:
      server-version:
        description: JETLS server release tag (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

jobs:
  open_release_pr:
    name: Open release PR
    runs-on: ubuntu-latest
    steps:
      # `RELEASE_PR_TOKEN` (a personal access token) is used instead of the
      # workflow token: pushes and pull requests created with `GITHUB_TOKEN`
      # do not trigger other workflows, so the release PR would get no CI.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Prepare and open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          SERVER_VERSION: ${{ github.event.client_payload.server_version || inputs.server-version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ ! "$SERVER_VERSION" =~ ^(20[0-9]{2})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]]; then
            echo "Invalid server release version: $SERVER_VERSION"
            exit 1
          fi
          YEAR=${BASH_REMATCH[1]}
          MONTH=${BASH_REMATCH[2]}
          DAY=${BASH_REMATCH[3]}
          # Client versions drop the zero padding (the Marketplace requires
          # semver, which rejects zero-padded numerals).
          VERSION="$YEAR.$((10#$MONTH)).$((10#$DAY))"

          ./scripts/prepare-release.sh --pin "$SERVER_VERSION" "$VERSION"
