name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build production extension bundle
        run: npm run build

  check_sync_schemas:
    name: Check package.json is in sync with the pinned release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Check package.json schemas
        run: node scripts/sync-schemas.mjs --check

  check_version_pin:
    name: Check JETLS_VERSION.json matches the pinned release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the julia bounds against the pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-julia-bounds.sh
