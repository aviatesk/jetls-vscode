version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # `vsce package` rejects `@types/vscode` newer than `engines.vscode`,
      # so this pin must move together with the minimum VS Code version.
      - dependency-name: "@types/vscode"
