name: Bug report
description: Report a bug in the VSCode extension (installation, startup, extension UI, packaging)
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched [existing issues](https://github.com/aviatesk/jetls-vscode/issues) and [JETLS.jl issues](https://github.com/aviatesk/JETLS.jl/issues) and confirmed this is not a duplicate.
          required: true
        - label: This is a problem of the VSCode extension itself (installation, startup, extension UI, packaging). Problems with language features (diagnostics, completions, hover, formatting, ...) should be reported to [JETLS.jl](https://github.com/aviatesk/JETLS.jl/issues/new/choose) instead, even when observed in VSCode.
          required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: The jetls-client version shown in the VSCode Extensions view.
      placeholder: "v2026.9.1"
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VSCode version
      placeholder: "1.135.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 26.5 / Windows 11 / Ubuntu 26.04"
    validations:
      required: true

  - type: textarea
    id: julia-environment
    attributes:
      label: Julia environment
      description: |
        How `julia` is provided (e.g. juliaup or a manual installation), the output of `julia --version`,
        and any related settings if configured (`jetls-client.executable`, `JULIAUP_CHANNEL`, `JULIA_APPS_JULIA_CMD`).
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug. What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the issue, if known.

  - type: textarea
    id: logs
    attributes:
      label: JETLS output (optional)
      description: |
        Relevant output from the "JETLS" output channel (View > Output > JETLS),
        e.g. installation progress or startup errors.
      render: text
